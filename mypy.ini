[mypy]
python_version = 3.10
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
# warn_unreachable is intentionally off: RemapByOTL drives control flow via a
# mutable self.success flag that helper methods flip, which mypy's flow analysis
# cannot see across calls, so it wrongly reports the guard branches as unreachable.
strict_optional = True
# Consider adding more strictness flags later if desired:
# disallow_untyped_defs = True
# disallow_incomplete_defs = True
# disallow_any_generics = True
# no_implicit_optional = True

[mypy-fontTools.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
